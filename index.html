<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バド戦術ドリル</title>
<meta name="theme-color" content="#2b4d3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="バド戦術">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=block" rel="stylesheet">
<style>
:root{
  --bg:#f3f2ec; --paper:#fff; --ink:#1b231f; --muted:#5b6862; --rule:#d6d5cb; --rule2:#e6e5dd;
  --blue:#2459d6; --red:#d33a3a; --yel:#ffd84d; --ok:#167a45; --ng:#c0392b; --floor:#2b4d3f; --focus:#ffb800;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:500 16px/1.65 "Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ring{outline:none}
.ring:focus-visible polygon{stroke:var(--focus);stroke-width:6}
[hidden]{display:none!important}
.ms{font-family:'Material Symbols Outlined';font-weight:500;font-size:22px;line-height:1;letter-spacing:normal;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ===== ホーム ===== */
.home-head{padding:28px 0 6px}
.home-head h1{font-size:30px;font-weight:900;letter-spacing:.02em}
.home-head p{margin-top:6px;color:var(--muted)}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--rule);margin-top:18px}
.tab{padding:10px 2px;min-height:44px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--ink)}
.start-row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:6px;font-weight:700;border:1px solid var(--ink);background:var(--paper)}
.btn.primary{background:var(--ink);color:#fff}
.btn small{font-weight:500;opacity:.75}
.btn:disabled{opacity:.35;cursor:default}
.a2hs{margin:-12px 0 16px;font-size:13px;color:var(--muted)}
.a2hs+.today-last{margin-top:0}
.today-last{margin:-12px 0 20px;font-size:14px;color:var(--muted)}
.today-last b{color:var(--ink)}
.h3{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.cats{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.cats li{border-bottom:1px solid var(--rule)}
.cats button{width:100%;display:grid;grid-template-columns:1fr auto;gap:0 16px;padding:14px 6px;min-height:64px}
.cats button:hover{background:var(--rule2)}
.c-name{font-weight:700;font-size:17px}
.c-desc{grid-column:1;color:var(--muted);font-size:14px}
.c-prog{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.4}
.c-prog b{color:var(--ink);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin:18px 0 0;font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.dot.blue{background:var(--blue)} .dot.red{background:var(--red)}
.home-foot{margin:40px 0 32px;padding-top:12px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;font-size:14px;color:var(--muted)}
.link{text-decoration:underline;text-underline-offset:3px;min-height:32px}
.link.warn{color:var(--ng)}
#debug{flex-basis:100%}
#debug summary{cursor:pointer;min-height:32px}
#debug pre{background:#111;color:#cfe8d6;padding:10px;border-radius:4px;max-height:240px;overflow:auto;font-size:12px;white-space:pre-wrap;margin:8px 0}

/* ===== 問題 ===== */
.qbar{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:6px}
.icon:hover{background:var(--rule2)}
.count{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.tag{font-size:13px;border:1px solid var(--rule);padding:1px 8px;border-radius:3px;color:var(--muted);background:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lv{margin-left:auto;font-size:14px;color:#9a7300;font-weight:700;white-space:nowrap}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "stage" "answer";gap:12px;padding:12px 0 36px}
.q-head{grid-area:head}
.q-head h2{font-size:23px;font-weight:900;line-height:1.35}
.q-head p{margin-top:4px}
.stage{grid-area:stage;background:var(--floor);border-radius:6px;overflow:hidden}
#court{display:block;width:100%;height:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#court text{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;text-anchor:middle;font-weight:900;pointer-events:none}
.stage-tools{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:6px 8px;background:#1f3a2e;color:#e6efe9;font-size:14px}
.tool{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 10px;border-radius:4px}
.tool:hover{background:rgba(255,255,255,.1)}
.tool[aria-pressed=true]{background:rgba(255,255,255,.2)}
.tool .ms{font-size:20px}
.stage-tools .legend{margin:0 4px 0 auto;color:#cfdcd5;font-size:13px;gap:2px 12px}
.answer{grid-area:answer}
.status{color:var(--muted);font-size:14px;margin-bottom:8px;min-height:1.6em}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;width:100%}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{opacity:.45;cursor:default}
.opt .k,.ex .k{font-weight:900;font-size:20px;width:26px;flex:none;text-align:center}
.shot{display:inline-block;font-size:12px;line-height:1.5;border:1px solid var(--rule);border-radius:3px;padding:0 6px;margin-right:8px;color:var(--muted);vertical-align:1px;white-space:nowrap}
.verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:28px;font-weight:900;line-height:1.3;padding-bottom:10px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.verdict small{font-size:16px;color:var(--ink);font-weight:700}
.sec{border-top:1px solid var(--rule);padding:12px 0}
.lab{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
.theory-t{font-size:19px;font-weight:900;line-height:1.5}
.explain{list-style:none;margin:0;padding:0}
.ex+.ex{border-top:1px solid var(--rule2)}
.ex button{width:100%;display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 0}
.ex .j{font-weight:900;font-size:18px;width:20px;flex:none}
.ex.ok .j{color:var(--ok)} .ex.ng .j{color:var(--ng)}
.ex .t{font-weight:700}
.you{display:inline-block;font-size:11px;font-weight:700;border:1px solid currentColor;border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:2px;color:var(--muted)}
.ex .play{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--muted);padding-left:8px}
.ex.playing .play{color:var(--ink);font-weight:700}
.ex p{margin:0 0 10px 66px;font-size:15px}
.drill p{font-size:15px}
.look{font-size:14px;margin-bottom:6px;padding:8px 10px;background:var(--paper);border:1px solid var(--rule);border-radius:4px}
.look b{margin-right:10px}
.think{list-style:none;margin:0;padding:0;counter-reset:th}
.think li{display:flex;gap:10px;padding:3px 0;font-size:15px}
.think li::before{counter-increment:th;content:counter(th);flex:none;width:20px;height:20px;margin-top:3px;border:1px solid var(--ink);border-radius:50%;font-size:12px;line-height:18px;text-align:center}
.think b{flex:none;width:3.2em}
.next-row{padding-top:14px}
.next-row .btn{width:100%}

/* ===== 結果 ===== */
.res-head{padding:28px 0 12px;border-bottom:1px solid var(--rule)}
.score{font-size:20px;font-weight:700;margin-top:2px}
.score b{font-size:48px;font-weight:900;margin-right:6px}
.res-list{list-style:none;margin:0;padding:0}
.res-list li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule)}
.res-list .j{font-weight:900;font-size:22px;width:24px;flex:none;line-height:1.3}
.res-list .ok .j{color:var(--ok)} .res-list .ng .j{color:var(--ng)}
.res-list b{display:block}
.res-list span.th{font-size:15px;color:var(--muted)}
.res-actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 40px}

@media (min-width:880px){
  .qgrid{grid-template-columns:minmax(0,1fr) minmax(340px,440px);grid-template-areas:"stage head" "stage answer";grid-template-rows:auto 1fr;column-gap:28px;align-items:start}
  .stage{position:sticky;top:8px}
  #court{max-height:calc(100vh - 110px)}
}
</style>
</head>
<body>
<div class="wrap" id="app">

  <!-- ===== ホーム ===== -->
  <section id="view-home">
    <header class="home-head">
      <h1>バド戦術ドリル</h1>
      <p>場面を見て、動く場所・打つ場所を選ぶ。○ と × の理由を、動きで確かめる。</p>
    </header>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-mode="doubles">ダブルス</button>
      <button class="tab" role="tab" data-mode="singles">シングルス</button>
    </nav>
    <div id="home-body"></div>
    <footer class="home-foot">
      <button class="link" id="btn-reset">記録を消す</button>
      <details id="debug">
        <summary>デバッグログを表示</summary>
        <pre id="debug-text">（まだ何もありません）</pre>
        <button class="link" id="btn-copylog">ログをコピー</button>
      </details>
    </footer>
  </section>

  <!-- ===== 問題 ===== -->
  <section id="view-quiz" hidden>
    <div class="qbar">
      <button class="icon" id="btn-back" aria-label="ホームへ"><span class="ms">arrow_back</span></button>
      <span class="count" id="q-count"></span>
      <span class="tag" id="q-tag"></span>
      <span class="lv" id="q-lv"></span>
    </div>
    <div class="qgrid">
      <div class="q-head">
        <h2 id="q-ask"></h2>
        <p id="q-scene"></p>
      </div>
      <div class="stage">
        <svg id="court" viewBox="0 0 800 1140" role="img" aria-label="コートの図"></svg>
        <div class="stage-tools">
          <button class="tool" id="btn-replay"><span class="ms">replay</span>場面をもう一度</button>
          <button class="tool" id="btn-slow" aria-pressed="false"><span class="ms">slow_motion_video</span>ゆっくり</button>
          <span class="legend"><span><span class="dot blue"></span>自分たち</span><span><span class="dot red"></span>相手</span></span>
        </div>
      </div>
      <div class="answer" id="q-answer"></div>
    </div>
  </section>

  <!-- ===== 結果 ===== -->
  <section id="view-result" hidden></section>
</div>

<script>
/* =====================================================================
 * バド戦術ドリル（v0.1 模型）
 * 単一 HTML・通信なし。記録は端末の localStorage にだけ残す。
 * ===================================================================== */

/* ---------- [S0] 画面組み込み型デバッグログ ---------- */
const DebugLog = {
  lines: [],
  push(level, args) {
    const t = new Date().toTimeString().slice(0, 8);
    const text = args.map(a => { if (typeof a === 'string') return a; try { return JSON.stringify(a); } catch (e) { return String(a); } }).join(' ');
    this.lines.push(`[${t}] ${level} ${text}`);
    if (this.lines.length > 300) this.lines.shift();
    const el = document.getElementById('debug-text');
    if (el) el.textContent = this.lines.join('\n');
  }
};
['log', 'warn', 'error'].forEach(k => {
  const orig = console[k].bind(console);
  console[k] = (...a) => { DebugLog.push(k.toUpperCase(), a); orig(...a); };
});
window.addEventListener('error', e => DebugLog.push('ERROR', [e.message + ' (' + (e.lineno || '-') + '行)']));
window.addEventListener('unhandledrejection', e => DebugLog.push('ERROR', ['Promise: ' + ((e.reason && e.reason.message) || e.reason)]));

/* ---------- [S1] ユーティリティ ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f1 = n => Math.round(n * 10) / 10;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const clonePos = p => { const o = {}; for (const k in p) o[k] = p[k].slice(); return o; };
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const STARS = ['', '★☆☆ きほん', '★★☆ ふつう', '★★★ むずかしい'];

/* ---------- [S2] 定数・問題データ ----------
 * 座標（m）：x は左右（-3.05〜3.05、自分たちから見て右が＋）。
 *           y は奥行き（0＝自分たちのバックライン、6.7＝ネット、13.4＝相手のバックライン）。
 * 全員右利き。相手は向かい合っているので、相手のバック側は x＋（こちらから見て右）。
 *
 * 1つの問題：start（最初の立ち位置）→ setup（場面までの打ち合い）→ 問い → 選択肢ごとの then（選んだあとの動き）。
 * 1打（step）：{ hit:打つ人, shot:球種, to:[x,y]（落ちる／取られる所）, mv:{人:[x,y]}（同時に動く人）, mark:{at,text}, end:高さ }
 * 次に打つ人は、とくに書かなければ to の位置まで自動で動く。シャトルがネットにかかる軌道は自動で持ち上げる。
 */
const HS = 0.75;          // 高さの見せ方（実際の高さ×HS で描く）
const NET_CLEAR = 1.75;   // ネットを越えるときの最低の高さ（m）
const GAP = 0.14;         // 1打ごとの間（秒）
const SLOW = 1.9;         // 「ゆっくり」の倍率
const LEAD = 0.45;        // 再生を始める前の間（秒）

const SHOT = {
  smash:  { h0: 3.0, a: 0.5,  t: 0.55, name: 'スマッシュ' },
  clear:  { h0: 2.6, a: 4.0,  t: 1.45, name: 'クリア' },
  aclear: { h0: 2.6, a: 1.6,  t: 1.0,  name: '速いクリア' },
  half:   { h0: 2.6, a: 1.4,  t: 1.0,  name: '浅い球' },
  lob:    { h0: 0.5, a: 4.0,  t: 1.45, name: 'ロブ' },
  drop:   { h0: 2.6, a: 0.6,  t: 1.05, name: 'ドロップ' },
  net:    { h0: 0.9, a: 0.45, t: 0.85, name: 'ヘアピン' },
  float:  { h0: 0.8, a: 0.5,  t: 0.85, name: '浮いた球' },
  push:   { h0: 1.7, a: 0.05, t: 0.5,  name: 'プッシュ' },
  drive:  { h0: 1.5, a: 0.25, t: 0.6,  name: 'ドライブ' },
  block:  { h0: 0.7, a: 0.5,  t: 0.85, name: 'レシーブ' },
  sshort: { h0: 1.0, a: 0.35, t: 0.85, name: 'ショートサービス' },
  slong:  { h0: 1.0, a: 4.5,  t: 1.55, name: 'ロングサービス' },
  shalf:  { h0: 1.0, a: 1.4,  t: 1.0,  name: '浮いたサービス' },
};

const CATS = {
  doubles: [
    { id: 'kirikae', name: '形の切りかえ',     desc: 'サイドバイサイド⇄トップアンドバック。上げたら横、上げさせたら縦' },
    { id: 'ito',     name: '考えて打つ',       desc: '打点の高さと相手の位置を見て、攻め・守り・崩すを決めてから打つ' },
    { id: 'kumitate', name: '組み立て',        desc: '1本で決めようとしない。崩してから攻める、2本・3本の流れ' },
    { id: 'zenei',   name: '前衛の役割',       desc: 'ネット前で、どこに立ち、何をたたくか' },
    { id: 'katachi', name: '形の中の立ち位置', desc: '横並び・縦の形のそれぞれで、どこに立つか' },
    { id: 'mamori',  name: 'レシーブとドライブ', desc: '守りの球を、攻めにつなげる' },
    { id: 'serve',   name: 'サービスとレシーブ', desc: '1球目・2球目・3球目の動き' },
    { id: 'haikyu',  name: '配球',             desc: 'どこへ打てば、相手が困るか' },
  ],
  singles: [
    { id: 'ito',      name: '考えて打つ',   desc: '打点の高さと相手の位置を見て、攻め・守り・崩すを決めてから打つ' },
    { id: 'kumitate', name: '組み立て',     desc: '1本で決めようとしない。崩してから攻める、2本・3本の流れ' },
    { id: 'home',     name: '戻る位置',     desc: '打ったあと、どこで構えるか' },
    { id: 'haikyu',   name: '配球',         desc: '相手を動かして、空いたところをつく' },
    { id: 'kurushii', name: '苦しいとき',   desc: '追いこまれたときの返し方' },
    { id: 'serve',    name: 'サービス',     desc: '1球目で主導権をにぎる' },
  ],
};

const QUESTIONS = [
/* ===== ダブルス ===== */
{ id: 'd01', mode: 'doubles', cat: 'zenei', lv: 1, who: 'B', type: 'move',
  title: 'スマッシュのときの前衛',
  ask: '前衛の B は、どこに構える？',
  scene: 'A が右奥から、ストレートにスマッシュを打つ。',
  start: { A: [1.5, 2.2], B: [0.0, 4.3], C: [-1.4, 9.6], D: [1.0, 8.9] },
  setup: [ { hit: 'D', shot: 'lob', to: [1.7, 1.0], mv: { D: [1.6, 10.6], C: [-1.5, 10.6] } } ],
  opts: [
    { k: 'ア', at: [0.9, 4.7], ok: true, label: '右前（シャトルが向かった側）',
      why: 'シャトルが向かった側に寄る。ストレートのスマッシュなら右。いちばん速く返ってくるストレートの返球を、前で止められる。',
      then: [ { hit: 'A', shot: 'smash', to: [1.6, 10.8], mv: { B: [0.9, 4.7] } }, { hit: 'D', shot: 'block', to: [1.0, 5.3] }, { hit: 'B', shot: 'push', to: [-0.2, 9.4] } ] },
    { k: 'イ', at: [-1.3, 4.7], label: '左前',
      why: '左に寄ると、いちばん返ってきやすいストレートの前が空く。',
      then: [ { hit: 'A', shot: 'smash', to: [1.6, 10.8], mv: { B: [-1.3, 4.7] } }, { hit: 'D', shot: 'block', to: [1.3, 5.4], mv: { B: [-0.2, 5.0] }, mark: { at: [1.3, 5.4], text: '空く' } } ] },
    { k: 'ウ', at: [0.1, 2.9], label: 'まん中の少し後ろ',
      why: '下がりすぎ。ネット前に落とされた球に届かない。前衛はショートサービスラインのあたりで、ラケットを上げて待つ。',
      then: [ { hit: 'A', shot: 'smash', to: [1.6, 10.8], mv: { B: [0.1, 2.9] } }, { hit: 'D', shot: 'block', to: [0.8, 5.6], mv: { B: [0.5, 4.0] }, mark: { at: [0.8, 5.6], text: '空く' } } ] },
  ],

/* ---------- [S5] コートの描画（透視投影・SVG） ---------- */
const CAM = (() => {
  const back = 6, H = 16, th = Math.atan2(H, 6.7 + back);   // カメラは自分たちのバックラインの 6m 後ろ・高さ 16m から、ネットの下を見る
  const c = Math.cos(th), s = Math.sin(th);
  return { back, H, c, s, z0: back * c + H * s, F: 1600, cx: 400, cy: 540 };
})();
/** コートの点 (x, y, 見せる高さ) → 画面 [sx, sy, 手前を1とした大きさ] */
function proj(x, y, h = 0) {
  const ry = y + CAM.back, rz = h - CAM.H;
  const z = ry * CAM.c - rz * CAM.s;
  const v = ry * CAM.s + rz * CAM.c;
  return [CAM.cx + CAM.F * x / z, CAM.cy - CAM.F * v / z, CAM.z0 / z];
}
const pt = p => f1(p[0]) + ',' + f1(p[1]);

function makeShot(from, to, a) {

/**

function buildTimeline(start, steps, hint) {

  (steps || []).forEach((st, i) => {

      if (!pos[st.hit]) throw new Error('打つ人がいません: ' + st.hit);
      const from = sh ? [sh.x, sh.y, sh.h] : [pos[st.hit][0], pos[st.hit][1], S.h0];
      const h1 = st.end != null ? st.end : (nxt ? SHOT[nxt.shot].h0 : 0);
      if (nxt && nxt.hit !== st.hit && !(nxt.hit in mv)) mv[nxt.hit] = st.to.slice();

      dur = st.t || S.t;
      sh = { x: st.to[0], y: st.to[1], h: h1 };

    for (const k in mv) to[k] = mv[k].slice();

      trails.forEach(tr => tr.past = true);
      trails.push({ shot: sg.shot, u, past: false });
      land = (u >= 1 && sg.shot.to[2] === 0) ? sg.shot.to : null;
    }
    if (u >= 1 && sg.mark) marks.push(sg.mark);
    if (u < 1) break;
  }
  return { pos, sh, trails, marks, land };
}

const Anim = {
  run: 0, raf: 0, slow: false, skip: false, playing: false,
  /** tl を最初から再生する。途中で別の再生が始まったら false で終わる */
  play(tl, start, prefix, draw) {
    const my = ++this.run;
    cancelAnimationFrame(this.raf);
    this.skip = false;
    return new Promise(resolve => {
      if (FAST || tl.total <= 0) { draw(frameAt(tl, start, tl.total + 1, prefix)); this.playing = false; resolve(true); return; }
      this.playing = true;
      let t = -LEAD, last = null;
      const tick = now => {
        if (my !== this.run) { resolve(false); return; }
        if (last != null) t += Math.min(0.25, (now - last) / 1000) / (this.slow ? SLOW : 1);   // 遅い端末でもコマ落ちするだけで、速さは変えない
        last = now;
        if (this.skip) t = tl.total + 1;
        draw(frameAt(tl, start, t, prefix));
        if (t >= tl.total) { this.playing = false; resolve(true); }
        else this.raf = requestAnimationFrame(tick);
      };
      this.raf = requestAnimationFrame(tick);
    });
  },
  stop() { this.run++; cancelAnimationFrame(this.raf); this.playing = false; },
};

/* ---------- [S8] ルーティング（画面の表示/非表示はここだけ） ---------- */
function show(view) {
  ['home', 'quiz', 'result'].forEach(v => { $('#view-' + v).hidden = v !== view; });
  Store.view = view;
  if (view !== 'quiz') Anim.stop();
  window.scrollTo(0, 0);
}

/* ---------- [S9] ホーム ---------- */
/*
 * 今日の10問：毎回ちがう10問を、重みつきのくじで選ぶ。
 *   まちがえた問題（最後の答えが×）… 重み 3
 *   まだ解いていない問題          … 重み 1.5
 *   正解した問題                  … 重み 1
 *   前回の今日の10問に出て、正解した問題 … 上の重み × 0.25（続けて同じ問題が出にくい）
 *   前回まちがえた問題は、出にくくしない（すぐ後の10問にも、多めに出る）
 * まちがえた問題は10問のうち半分（5問）まで。ほかの場面もまざるようにするため。
 */
const TODAY = { n: 10, missW: 3, newW: 1.5, okW: 1, prevW: 0.25, missCap: 5 };
/** ホーム画面から開いていないスマホか（そのときだけ「ホーム画面に追加」の案内を出す） */
const showA2HS = () => { try { return !(matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) && matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } };
const localDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

/** @returns {string[]} 選んだ問題の id（★の低い順。同じ★の中はばらばら） */
function pickToday(mode, rand = Math.random) {
  const prev = new Set(Progress.data.today.ids[mode] || []);
  const pool = QUESTIONS.filter(q => q.mode === mode).map(q => {
    const r = Progress.get(q.id), miss = !!(r && r.last === false);
    let w = miss ? TODAY.missW : !r ? TODAY.newW : TODAY.okW;
    if (prev.has(q.id) && !miss) w *= TODAY.prevW;
    return { q, w, miss, tie: rand() };
  });
  const out = []; let missN = 0;
  while (out.length < TODAY.n && pool.length) {
    const open = pool.filter(p => !(p.miss && missN >= TODAY.missCap));
    const list = open.length ? open : pool;
    let x = rand() * list.reduce((a, p) => a + p.w, 0), pick = list[list.length - 1];
    for (const p of list) { x -= p.w; if (x <= 0) { pick = p; break; } }
    out.push(pick); if (pick.miss) missN++;
    pool.splice(pool.indexOf(pick), 1);
  }
  return out.sort((a, b) => a.q.lv - b.q.lv || a.tie - b.tie).map(p => p.q.id);
}

const byLevel = (a, b) => a.lv - b.lv || QUESTIONS.indexOf(a) - QUESTIONS.indexOf(b);

function renderHome() {
  const mode = Store.mode;
  document.querySelectorAll('.tab').forEach(t => { const on = t.dataset.mode === mode; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); });
  const qs = QUESTIONS.filter(q => q.mode === mode);
  const miss = qs.filter(q => { const r = Progress.get(q.id); return r && r.last === false; });
  const last = Progress.data.today.last[mode];
  const cats = CATS[mode].map(c => {
    const list = qs.filter(q => q.cat === c.id);
    const done = list.filter(q => { const r = Progress.get(q.id); return r && r.best; }).length;
    const lvs = list.map(q => q.lv), lo = Math.min(...lvs), hi = Math.max(...lvs);
    const lvText = '★'.repeat(lo) + (hi > lo ? '〜' + '★'.repeat(hi) : '');
    return `<li><button data-start="cat:${c.id}">
      <span class="c-name">${esc(c.name)}</span>
      <span class="c-desc">${esc(c.desc)}</span>
      <span class="c-prog"><b>${done}</b> / ${list.length} 正解<br>${lvText}</span>
    </button></li>`;
  }).join('');
  $('#home-body').innerHTML = `
    <div class="start-row">
      <button class="btn primary" data-start="today">今日の10問<small>まちがえた問題が多めに出る</small></button>
      <button class="btn" data-start="all">通しで解く<small>${qs.length}問</small></button>
      <button class="btn" data-start="miss" ${miss.length ? '' : 'disabled'}>まちがえた問題<small>${miss.length}問</small></button>
    </div>
    ${showA2HS() ? '<p class="a2hs">スマホは「ホーム画面に追加」して開くと、記録が消えにくくなります（iPhone：共有ボタン →「ホーム画面に追加」）</p>' : ''}
    ${last ? `<p class="today-last">前回の今日の10問：<b>${last.score}</b> / ${last.total}（${Number(last.at.slice(5, 7))}/${Number(last.at.slice(8, 10))}）</p>` : ''}
    <p class="h3">場面で選ぶ</p>
    <ul class="cats">${cats}</ul>
    <p class="legend"><span><span class="dot blue"></span>自分たち（A・B）</span><span><span class="dot red"></span>相手（C・D）</span><span>全員右利きの想定</span></p>`;
}

function startFrom(key) {
  const qs = QUESTIONS.filter(q => q.mode === Store.mode);
  let list;
  if (key === 'today') {
    const ids = pickToday(Store.mode);
    Progress.data.today.ids[Store.mode] = ids; Progress.save();   // 始めた時点で「前回の10問」にする（途中でやめても、次は別の10問）
    console.log(`今日の10問（${Store.mode}）: ${ids.join(' ')}`);
    startSet(ids, 'today');
    return;
  }
  if (key === 'all') list = qs.slice().sort(byLevel);
  else if (key === 'miss') list = qs.filter(q => { const r = Progress.get(q.id); return r && r.last === false; }).sort(byLevel);
  else list = qs.filter(q => q.cat === key.slice(4)).sort(byLevel);
  if (list.length) startSet(list.map(q => q.id));
}
function startSet(ids, kind = 'set') {
  Store.set = ids; Store.i = 0; Store.res = {}; Store.kind = kind;
  show('quiz');
  Quiz.load(ids[0]);
}

/* ---------- [S10] 問題を解く ---------- */
const okOpt = q => q.opts.find(o => o.ok);
const catName = q => (CATS[q.mode].find(c => c.id === q.cat) || {}).name || '';

const Quiz = {
  load(id) {
    const q = QMAP[id];
    if (!q) { console.error('問題が見つかりません: ' + id); return; }
    Object.assign(Store, { q, answered: false, chosen: null, playingKey: null });
    Court.setMode(q.mode);
    Store.base = { pos: clonePos(q.start), sh: q.sh ? { x: q.sh[0], y: q.sh[1], h: q.sh[2] } : null };
    Store.setupTL = buildTimeline(Store.base, q.setup, firstHit(okOpt(q).then));
    Store.after = Store.setupTL.end;
    Store.afterTrails = Store.setupTL.segs.filter(s => s.shot).map(s => s.shot);
    $('#q-count').textContent = `${Store.i + 1} / ${Store.set.length}`;
    $('#q-tag').textContent = `${q.mode === 'doubles' ? 'ダブルス' : 'シングルス'}｜${catName(q)}`;
    $('#q-lv').textContent = STARS[q.lv];
    $('#q-ask').textContent = q.ask;
    $('#q-scene').textContent = q.scene;
    Store.setupDone = this.playSetup();
  },
  rings() {
    const q = Store.q;
    if (Store.phase === 'setup' || q.type === 'plan') return null;   // 組み立ては2本以上の流れなので、円1つでは表せない
    return q.opts.map(o => ({
      k: o.k, at: o.at,
      state: !Store.answered ? 'idle' : o.ok ? 'ok' : (o.k === Store.chosen || o.k === Store.playingKey) ? 'ng' : 'dim',
    }));
  },
  async playSetup() {
    const q = Store.q;
    Store.phase = 'setup'; Store.playingKey = null;
    renderAnswer();
    const done = await Anim.play(Store.setupTL, Store.base, [], fr => Court.draw(fr, { who: q.who }));
    if (!done || Store.q !== q) return;
    Store.phase = Store.answered ? 'review' : 'ask';
    Store.askAt = performance.now();
    Court.draw(frameAt(Store.setupTL, Store.base, Store.setupTL.total + 1, []), { who: q.who, rings: this.rings() });
    renderAnswer();
  },
  choose(k) {
    const q = Store.q;
    if (Store.answered || Store.phase !== 'ask') return;
    const o = q.opts.find(x => x.k === k);
    if (!o) return;
    Store.answered = true; Store.chosen = k; Store.phase = 'review';
    Store.res[q.id] = !!o.ok;
    Progress.record(q.id, !!o.ok);
    console.log(`回答 ${q.id}: ${k} → ${o.ok ? '正解' : '不正解'}`);
    renderAnswer();
    this.playOption(k);
  },
  async playOption(k) {
    const q = Store.q, o = q.opts.find(x => x.k === k);
    Store.phase = 'review'; Store.playingKey = k;
    markPlaying();
    const tl = buildTimeline(Store.after, o.then, null);
    const done = await Anim.play(tl, Store.after, Store.afterTrails, fr => Court.draw(fr, { who: q.who, rings: this.rings() }));
    if (!done || Store.q !== q) return;
    Store.playingKey = null;
    markPlaying();
  },
  next() {
    if (Store.i + 1 < Store.set.length) { Store.i++; Quiz.load(Store.set[Store.i]); window.scrollTo(0, 0); }
    else renderResult();
  },
};

function renderAnswer() {
  const q = Store.q, box = $('#q-answer');
  if (!Store.answered) {
    const wait = Store.phase === 'setup';
    box.innerHTML = `${q.think ? '<p class="look"><b>打つ前に見る</b>① 打点の高さ　② 相手の位置　→ ③ ねらい（攻め・守り・崩す）</p>' : ''}
      <p class="status">${wait ? '場面を再生中…（コートを押すと早送り）' : q.type === 'plan' ? '打つ順番を、下のボタンで選ぶ' : 'コートの円か、下のボタンで答える'}</p>
      <div class="opts">${q.opts.map(o => `<button class="opt" data-k="${esc(o.k)}" ${wait ? 'disabled' : ''}>
        <span class="k">${esc(o.k)}</span><span>${o.shot ? `<span class="shot">${esc(SHOT[o.shot].name)}</span>` : ''}${esc(o.label)}</span></button>`).join('')}</div>`;
    return;
  }
  const ok = Store.res[q.id], right = okOpt(q);
  const last = Store.i + 1 >= Store.set.length;
  box.innerHTML = `
    <div class="verdict ${ok ? 'ok' : 'ng'}">${ok ? '○ 正解' : '× ちがう'}${ok ? '' : `<small>正解は ${esc(right.k)}</small>`}</div>
    ${q.think ? `<div class="sec"><span class="lab">考える順番</span><ol class="think">${q.think.map(t => { const [h, ...r] = t.split('：'); return `<li><b>${esc(h)}</b><span>${esc(r.join('：'))}</span></li>`; }).join('')}</ol></div>` : ''}
    <div class="sec"><span class="lab">セオリー</span><p class="theory-t">${esc(q.theory)}</p></div>
    <div class="sec"><span class="lab">それぞれの動きを見る</span>
      <ul class="explain">${q.opts.map(o => `<li class="ex ${o.ok ? 'ok' : 'ng'}" data-k="${esc(o.k)}">
        <button data-play="${esc(o.k)}"><span class="k">${esc(o.k)}</span><span class="j">${o.ok ? '○' : '×'}</span>
          <span class="t">${o.shot ? `<span class="shot">${esc(SHOT[o.shot].name)}</span>` : ''}${esc(o.label)}${o.k === Store.chosen ? '<span class="you">あなたの答え</span>' : ''}</span>
          <span class="play"><span class="ms">play_arrow</span><span class="pl">見る</span></span></button>
        <p>${esc(o.why)}</p></li>`).join('')}</ul></div>
    <div class="sec drill"><span class="lab">練習でやってみよう</span><p>${esc(q.drill)}</p></div>
    <div class="next-row"><button class="btn primary" id="btn-next">${last ? '結果を見る' : '次の問題へ'}</button></div>`;
  markPlaying();
}
function markPlaying() {
  document.querySelectorAll('.ex').forEach(li => {
    const on = li.dataset.k === Store.playingKey;
    li.classList.toggle('playing', on);
    const pl = li.querySelector('.pl'); if (pl) pl.textContent = on ? '再生中' : '見る';
  });
}

/* ---------- [S11] 結果 ---------- */
function renderResult() {
  const ids = Store.set, okN = ids.filter(id => Store.res[id]).length;
  const miss = ids.filter(id => !Store.res[id]);
  const today = Store.kind === 'today';
  if (today) { Progress.data.today.last[Store.mode] = { score: okN, total: ids.length, at: localDate() }; Progress.save(); }
  $('#view-result').innerHTML = `
    <div class="res-head"><span class="lab">${today ? '今日の10問の結果' : '結果'}</span><p class="score"><b>${okN}</b>/ ${ids.length} 問 正解</p></div>
    <ol class="res-list">${ids.map(id => { const q = QMAP[id], ok = Store.res[id];
      return `<li class="${ok ? 'ok' : 'ng'}"><span class="j">${ok ? '○' : '×'}</span><div><b>${esc(q.title)}</b><span class="th">${esc(q.theory)}</span></div></li>`; }).join('')}</ol>
    <div class="res-actions">
      ${miss.length ? `<button class="btn primary" id="btn-retry">まちがえた ${miss.length} 問をもう一度</button>` : ''}
      ${today ? `<button class="btn ${miss.length ? '' : 'primary'}" id="btn-today">新しい10問</button>` : ''}
      <button class="btn ${miss.length || today ? '' : 'primary'}" id="btn-home">ホームへ</button>
    </div>`;
  Store.retry = miss;
  show('result');
}

/* ---------- [S12] 操作のつなぎこみ ---------- */
/** スマホで解説を読んでいる途中に「見る」を押したら、コートが見える所まで戻す */
function showStage() {
  const r = $('.stage').getBoundingClientRect();
  const seen = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0);
  if (seen < r.height * 0.6) $('.stage').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function bind() {
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    Store.mode = t.dataset.mode; Progress.data.mode = Store.mode; Progress.save(); renderHome();
  }));
  $('#home-body').addEventListener('click', e => { const b = e.target.closest('[data-start]'); if (b && !b.disabled) startFrom(b.dataset.start); });
  $('#btn-back').addEventListener('click', () => { renderHome(); show('home'); });
  $('#btn-replay').addEventListener('click', () => Quiz.playSetup());
  $('#btn-slow').addEventListener('click', e => {
    Anim.slow = !Anim.slow; Progress.data.slow = Anim.slow; Progress.save();
    e.currentTarget.setAttribute('aria-pressed', Anim.slow);
  });
  $('#court').addEventListener('click', e => {
    const r = e.target.closest('.ring');
    // 早送りのタップが、出てきたばかりの円に当たって答えにならないように、円が出てすぐは受けつけない
    if (r && !Store.answered && Store.phase === 'ask') { if (performance.now() - Store.askAt > 400) Quiz.choose(r.dataset.k); return; }
    if (Anim.playing) Anim.skip = true;
  });
  $('#court').addEventListener('keydown', e => {
    const r = e.target.closest && e.target.closest('.ring');
    if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); Quiz.choose(r.dataset.k); }
  });
  $('#q-answer').addEventListener('click', e => {
    const o = e.target.closest('.opt'); if (o && !o.disabled) { Quiz.choose(o.dataset.k); return; }
    const p = e.target.closest('[data-play]'); if (p) { showStage(); Quiz.playOption(p.dataset.play); return; }
    if (e.target.closest('#btn-next')) Quiz.next();
  });
  $('#view-result').addEventListener('click', e => {
    if (e.target.closest('#btn-retry')) startSet(Store.retry);
    if (e.target.closest('#btn-today')) startFrom('today');
    if (e.target.closest('#btn-home')) { renderHome(); show('home'); }
  });
  let armed = 0;
  $('#btn-reset').addEventListener('click', e => {
    const b = e.currentTarget;
    if (Date.now() - armed < 4000) { Progress.reset(); renderHome(); b.textContent = '記録を消しました'; b.classList.remove('warn'); armed = 0; setTimeout(() => { b.textContent = '記録を消す'; }, 2500); return; }
    armed = Date.now(); b.textContent = 'もう一度押すと、正解の記録がすべて消えます'; b.classList.add('warn');
    setTimeout(() => { if (armed && Date.now() - armed >= 4000) { b.textContent = '記録を消す'; b.classList.remove('warn'); armed = 0; } }, 4100);
  });
  $('#btn-copylog').addEventListener('click', () => {
    const text = DebugLog.lines.join('\n') || '(ログなし)';
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => console.log('ログをコピーしました'), () => console.warn('コピーできませんでした'));
  });
}

/* ---------- [S13] 問題データの点検（検証用・BD.lint()） ---------- */
function lint() {
  const errs = [];
  const inCourt = (p, singles) => Math.abs(p[0]) <= (singles ? 2.59 : 3.05) + 1e-9 && p[1] >= 0 && p[1] <= 13.4;
  const ids = new Set();
  QUESTIONS.forEach(q => {
    const tag = q.id;
    if (ids.has(q.id)) errs.push(tag + ': id が重複'); ids.add(q.id);
    if (q.opts.filter(o => o.ok).length !== 1) errs.push(tag + ': 正解がちょうど1つでない');
    if (!CATS[q.mode].some(c => c.id === q.cat)) errs.push(tag + ': cat が無い');
    if (!['A', 'B'].includes(q.who) || !q.start[q.who]) errs.push(tag + ': who がおかしい');
    if (q.mode === 'singles' && Object.keys(q.start).some(k => !['A', 'C'].includes(k))) errs.push(tag + ': シングルスに A・C 以外がいる');
    try {
      const base = { pos: clonePos(q.start), sh: q.sh ? { x: q.sh[0], y: q.sh[1], h: q.sh[2] } : null };
      const st = buildTimeline(base, q.setup, firstHit(okOpt(q).then));
      const hitter = st.end.sh ? Object.keys(st.end.pos).find(k => dist(st.end.pos[k], [st.end.sh.x, st.end.sh.y]) < 0.05) : null;
      q.opts.forEach(o => {
        const t = `${tag} ${o.k}`;
        const h = firstHit(o.then);
        if (h && hitter && h.hit !== hitter && q.setup.length) errs.push(t + `: 最初に打つ人(${h.hit})がシャトルの所にいない(${hitter})`);
        const tl = buildTimeline(st.end, o.then, null);
        tl.segs.forEach(sg => {
          if (!sg.shot) return;
          const inside = inCourt(sg.shot.to, q.mode === 'singles');
          if (sg.shot.to[2] === 0 && !inside && !sg.out) errs.push(t + ': 落ちる所がコートの外');
          if (sg.out && inside) errs.push(t + ': out なのにコートの中に落ちる');
          if (sg.shot.a > 6) errs.push(t + ': 軌道の山が高すぎる');
        });
        if ((q.cat === 'ito' || q.cat === 'kumitate') && !(Array.isArray(q.think) && q.think.length === 3)) errs.push(t + ': 考える順番（think）が3行でない');
        if (q.think && !/^だから：(攻め|守り|崩す)/.test(q.think[2])) errs.push(t + ': think の3行目が「だから：攻め／守り／崩す」で始まらない');
        if (q.type === 'move') {
          const m = o.then.find(s => s.mv && s.mv[q.who]);
          if (!m || dist(m.mv[q.who], o.at) > 1e-9) errs.push(t + ': 円の位置と、動く先が合わない');
        } else if (q.type === 'plan') {
          if (!o.then[0] || o.then[0].hit !== q.who) errs.push(t + ': 最初の1打が who でない');
          if (o.ok && o.then.filter(s => s.hit === 'A' || s.hit === 'B').length < 2) errs.push(t + ': 組み立ての正解に、自分たちの打球が2本以上ない');
          if (!/①/.test(o.label)) errs.push(t + ': 組み立ての選択肢が「① …」の形でない');
        } else if (q.type === 'shot') {
          if (!o.then[0] || o.then[0].hit !== q.who) errs.push(t + ': 最初の1打が who でない');
          else if (dist(o.then[0].to, o.at) > 1.5) errs.push(t + ': 円とねらいがずれている');
          if (!o.shot || !SHOT[o.shot]) errs.push(t + ': 球種の表示が無い');
          const sv = o.then[0];
          if (sv && /^s(short|long|half)$/.test(sv.shot)) {
            const longLine = q.mode === 'doubles' ? 12.64 : 13.4, side = q.mode === 'doubles' ? 3.05 : 2.59;
            const diag = Math.sign(sv.to[0]) !== Math.sign(q.start[q.who][0]);
            if (sv.to[1] < 8.68 || sv.to[1] > longLine || Math.abs(sv.to[0]) > side || !diag) errs.push(t + ': サービスがサービスコートに入っていない');
          }
        } else errs.push(t + ': type が move／shot／plan のどれでもない');
      });
    } catch (e) { errs.push(tag + ': ' + e.message); }
  });
  return errs;
}

/* ---------- [S14] 検証用の入口（window.BD） ---------- */
window.BD = {
  fast(on = true) { FAST = on; return FAST; },
  lint,
  async go(id) { startSet([id]); await Store.setupDone; return BD.state(); },
  pick(k) { Quiz.choose(k); return Store.answered; },
  async ok(id) { await BD.go(id); Quiz.choose(okOpt(QMAP[id]).k); return BD.state(); },
  async ng(id, k) { await BD.go(id); Quiz.choose(k); return BD.state(); },
  play(k) { Quiz.playOption(k); return k; },
  state() { return { view: Store.view, q: Store.q && Store.q.id, phase: Store.phase, answered: Store.answered, chosen: Store.chosen, playing: Anim.playing, i: Store.i, n: Store.set.length }; },
  ids() { return QUESTIONS.map(q => q.id); },
  pickToday,
};

/* ---------- [S15] 起動 ---------- */
(function boot() {
  try {
    Progress.load();
    Store.mode = CATS[Progress.data.mode] ? Progress.data.mode : 'doubles';
    Anim.slow = !!Progress.data.slow;
    $('#btn-slow').setAttribute('aria-pressed', Anim.slow);
    Court.init();
    bind();
    renderHome();
    const errs = lint();
    if (errs.length) console.warn('問題データの点検: ' + errs.join(' / '));
    console.log(`起動しました（問題 ${QUESTIONS.length} 問）`);
  } catch (e) {
    console.error('起動に失敗しました: ' + e.message);
  }
})();
</script>
